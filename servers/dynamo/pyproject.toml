[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dso-dynamo-mcp"
version = "0.1.0"
description = "MCP server for the DYNAMO apps on Tapis Pods — search, configure, author, run and monitor models"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
]

[project.scripts]
dso-dynamo-mcp = "dso_dynamo_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dso_dynamo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
]
